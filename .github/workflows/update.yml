name: Update data

on:
  # GeoThai/source refreshes on Mondays at 02:00 UTC. A daily check picks up a release the same day.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [data-release]

permissions:
  contents: write
  actions: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: true

      - name: Find the latest GeoThai/data release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --repo GeoThai/data --json tagName --jq .tagName)
          current=$(cat data.version)
          if ! [[ "$latest" =~ ^v[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Unexpected release tag: $latest"
            exit 1
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "Already on $current"
          else
            echo "New release: $current -> $latest"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.release.outputs.changed == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Build on the new release
        if: steps.release.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.release.outputs.latest }}
        run: |
          echo "$LATEST" > data.version
          uv sync --locked
          uv run python scripts/data.py
          uv run pyright
          uv run pytest
          uv run python scripts/wheel_test.py

      - name: Commit and tag a patch version
        id: version
        if: steps.release.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.release.outputs.latest }}
        run: |
          version="v$(uv version --bump patch --short)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.version pyproject.toml uv.lock src/geothai
          git commit -m "fix: data from GeoThai/data $LATEST"
          git tag -a "$version" -m "$version"
          git push origin HEAD:refs/heads/main "refs/tags/$version"
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      # A push with GITHUB_TOKEN starts no workflow, but a dispatch does.
      - name: Publish
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run publish.yml --ref "$TAG"
