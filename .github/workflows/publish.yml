name: Publish

# Push a tag vX.Y.Z that matches pyproject.toml to publish that version to PyPI.
# update.yml starts this workflow on its own tag, because its push starts nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: uv sync --locked
      - name: Tag matches pyproject.toml
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - run: uv run pytest
      - run: uv run python scripts/wheel_test.py
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      - run: npx changelogithub@15.0.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
