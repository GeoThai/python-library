[project]
name = "geothai"
version = "3.0.0"
description = "Every province, district, subdistrict and postal code of Thailand, with types and search"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["thailand", "provinces", "districts", "subdistricts", "postal-code", "address"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: Thai",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
authors = [
    { name = "Pongsakorn Thipayanate", email = "contact@fasu.dev" }
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://geothai.fasu.dev"
Repository = "https://github.com/GeoThai/python-library"
Changelog = "https://geothai.fasu.dev/changelog/"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/geothai/_schema.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "N", "RUF", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D", "ANN401"]

[tool.pytest.ini_options]
testpaths = ["src", "tests", "README.md"]
addopts = "--doctest-modules --doctest-glob=README.md"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["src", "tests", "scripts"]
