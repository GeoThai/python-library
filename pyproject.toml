[project]
name = "geothai"
version = "0.1.0"
authors = [
    { name = "Pongsakorn Thipayanate", email = "contact@fasu.dev" }
]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "N", "RUF", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = "--doctest-modules"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["src", "tests", "scripts"]
